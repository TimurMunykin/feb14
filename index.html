<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Object Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <img id="main-image" src="images/main.svg" alt="Find hidden objects" draggable="false">
    <div id="hotspots-layer"></div>
    <div id="popup-container"></div>
  </div>

  <div id="hud">
    <div id="counter">Found: 0 / 0</div>
    <button id="btn-hint">Hint</button>
  </div>

  <div id="editor-panel" class="hidden">
    <h3>Editor</h3>
    <p>Click on image to add hotspot</p>
    <p>Drag to move &middot; Right-click to delete</p>
    <div class="editor-buttons">
      <button id="btn-export">Export JSON</button>
      <button id="btn-import">Import JSON</button>
    </div>
    <textarea id="json-area" placeholder="Paste JSON here for import..."></textarea>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
