<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра на поиск воспоминаний</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <img id="main-image" src="images/Gemini_Generated_Image_6tpxsi6tpxsi6tpx.png" alt="Найди спрятанные объекты" draggable="false">
    <div id="hotspots-layer"></div>
    <div id="popup-container"></div>
  </div>

  <div id="hud" class="hidden">
    <div id="counter">Найдено: 0 из 0</div>
    <button id="btn-hint">Подсказка</button>
  </div>

  <div id="editor-panel" class="hidden">
    <h3>Editor</h3>
    <p>Click image to add &middot; Click spot to select</p>
    <p>Drag to move &middot; Del to delete &middot; Scroll to resize</p>
    <div class="editor-buttons">
      <button id="btn-export">Export JSON</button>
      <button id="btn-import">Import JSON</button>
    </div>
    <textarea id="json-area" placeholder="Paste JSON here for import..."></textarea>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
